<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音乐下载器 · Web</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">音乐下载器 <span class="tag">Web</span></div>
    <button id="btn-mode" class="mode-btn" title="切换到播放器模式"></button>
    <div class="spacer"></div>
    <div class="account">
      <span id="account-text" class="muted small">未登录</span>
      <button id="btn-login" class="ghost tiny">登录</button>
      <button id="btn-logout" class="ghost tiny" hidden>退出</button>
    </div>
    <div class="icon-group">
      <button id="btn-download" class="icon-btn" data-menu="download" title="下载"><span class="icon-slot"></span></button>
      <button id="btn-export" class="icon-btn" data-menu="export" title="导出"><span class="icon-slot"></span></button>
      <span class="divider"></span>
      <button id="btn-tasks" class="icon-btn" title="下载任务"><span class="icon-slot"></span><i class="dot" hidden></i></button>
      <button id="btn-open-dir" class="icon-btn" title="打开下载目录"><span class="icon-slot"></span></button>
      <button id="btn-settings" class="icon-btn" title="设置"><span class="icon-slot"></span></button>
    </div>
  </header>

  <!-- 下载模式：查询栏 + 一体式列表 -->
  <section id="download-view" class="view">
    <div class="query-bar">
      <div class="scope-group" id="scope-group">
        <button class="scope-btn active" data-scope="search" title="按关键词搜索"><span class="icon-slot"></span></button>
        <button class="scope-btn" data-scope="link" title="按歌单 / 单曲链接 或 ID 加载"><span class="icon-slot"></span></button>
        <button class="scope-btn like-btn" id="btn-liked" title="我喜欢的音乐"><span class="icon-slot"></span></button>
      </div>
      <input id="query-input" type="text" placeholder="搜索歌曲 / 歌手 / 专辑，或粘贴歌单链接、歌单 ID">
      <button id="btn-query" class="primary">搜索</button>
      <button id="btn-my-playlists" class="ghost">我的歌单</button>
      <button id="btn-cover" class="cover-btn" title="当前播放 · 打开播放器窗口" hidden>
        <img id="btn-cover-img" alt="">
      </button>
    </div>
    <div class="list-bar" id="song-bar">
      <span id="list-status" class="muted small"></span>
      <span class="spacer"></span>
      <span id="list-pick" class="pick-hint muted small" hidden></span>
      <span class="sep muted" hidden>·</span>
      <span id="list-count" class="muted small"></span>
      <button id="btn-pick-all" class="ghost tiny" hidden>全选</button>
      <button id="btn-play-all" class="ghost tiny" hidden>全部播放</button>
    </div>
    <div class="table-wrap" id="song-area">
      <div id="song-list" class="song-list empty">暂无内容，试试搜索或粘贴歌单链接</div>
    </div>
  </section>

  <!-- 播放器模式：封面信息左半屏 + 歌词右半屏 -->
  <section id="play-view" class="view" hidden>
    <div class="player">
      <div class="player-left">
        <img id="pl-cover" class="pl-cover" alt="">
        <h2 id="pl-name">未在播放</h2>
        <p class="muted" id="pl-artist">双击列表中的歌曲即可播放</p>
        <div class="pl-progress">
          <span id="pl-cur" class="mono">00:00</span>
          <input id="pl-seek" type="range" min="0" max="1000" value="0" step="1">
          <span id="pl-dur" class="mono">00:00</span>
        </div>
        <div class="pl-ctl">
          <button id="pl-prev" class="icon-btn" title="上一首"></button>
          <button id="pl-toggle" class="icon-btn play" title="播放 / 暂停"></button>
          <button id="pl-next" class="icon-btn" title="下一首"></button>
          <button id="pl-mode" class="ghost tiny" title="播放模式">顺序播放</button>
          <span class="spacer"></span>
          <button id="pl-list" class="icon-btn" title="播放列表"></button>
        </div>
        <div class="pl-vol">
          <button id="pl-mute" class="icon-btn small" title="静音 / 恢复"></button>
          <input id="pl-volume" type="range" min="0" max="100" value="100" step="1">
        </div>
        <div id="pl-hint" class="muted small"></div>
      </div>
      <div class="player-right">
        <div id="pl-lyric" class="lyric-box is-empty">（暂无歌词）</div>
      </div>
    </div>
  </section>

  <footer class="statusbar">
    <div id="status-lyric" class="status-lyric" hidden><span id="status-lyric-inner" class="status-lyric-inner"></span></div>
    <div class="progress"><div class="bar" id="global-bar"></div></div>
    <button id="global-pct" class="status-pct" title="点击清空进度">—</button>
  </footer>
</div>

<!-- 左缘悬浮岛：播放列表（右侧不再有悬浮岛，下载任务改为独立窗口） -->
<div class="edge-hot left" id="hot-left" title="鼠标靠近左边缘唤出播放列表"></div>

<aside id="island-queue" class="island" data-kind="queue" hidden>
  <div class="island-head" data-drag>
    <b>播放列表</b>
    <span class="muted small" id="queue-count"></span>
    <span class="spacer"></span>
    <button class="icon-btn island-close" data-icon="close" title="收起"></button>
  </div>
  <div class="island-body">
    <p class="muted small">单击条目切换当前播放 · 右键更多操作</p>
    <div id="queue-list" class="task-list empty">播放列表为空</div>
  </div>
</aside>

<!-- 播放器窗口：封面信息左半屏，右侧上方切换 歌词 / 播放列表 / 歌曲信息 -->
<div id="player-window" class="pwin" hidden>
  <div class="pwin-head" data-drag>
    <b>播放器</b>
    <span class="spacer"></span>
    <button id="pw-close" class="icon-btn" data-icon="close" title="关闭"></button>
  </div>
  <div class="pwin-body">
    <div class="pwin-left">
      <img id="pw-cover" class="pw-cover" alt="">
      <h3 id="pw-name" class="marquee"><span class="mq">未在播放</span></h3>
      <p id="pw-artist" class="muted small"></p>
      <div class="pl-progress">
        <span id="pw-cur" class="mono">00:00</span>
        <input id="pw-seek" type="range" min="0" max="1000" value="0" step="1">
        <span id="pw-dur" class="mono">00:00</span>
      </div>
      <div class="pl-ctl">
        <button id="pw-prev" class="icon-btn" title="上一首"></button>
        <button id="pw-toggle" class="icon-btn play" title="播放 / 暂停"></button>
        <button id="pw-next" class="icon-btn" title="下一首"></button>
        <button id="pw-mode" class="ghost tiny" title="播放模式">顺序播放</button>
      </div>
      <div class="pl-vol">
        <button id="pw-mute" class="icon-btn small" title="静音 / 恢复"></button>
        <input id="pw-volume" type="range" min="0" max="100" value="100" step="1">
      </div>
    </div>
    <div class="pwin-right">
      <div class="tabs-mini pw-tabs">
        <button class="active" data-pw-tab="lyric">歌词</button>
        <button data-pw-tab="queue">播放列表</button>
        <button data-pw-tab="info">歌曲信息</button>
      </div>
      <div class="pw-panels">
        <div class="pw-panel" data-pw-panel="lyric">
          <div id="pw-lyric" class="lyric-box is-empty">（暂无歌词）</div>
        </div>
        <div class="pw-panel" data-pw-panel="queue" hidden>
          <div id="pw-queue" class="task-list empty">播放列表为空</div>
        </div>
        <div class="pw-panel" data-pw-panel="info" hidden>
          <div id="pw-info" class="pw-info"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 下载任务窗口：可拉伸、列表可滚动 -->
<div id="tasks-window" class="pwin tasks-win" hidden>
  <div class="pwin-head" data-drag>
    <b>下载任务</b>
    <span class="muted small" id="tasks-count"></span>
    <span class="spacer"></span>
    <button id="tasks-close" class="icon-btn" data-icon="close" title="关闭"></button>
  </div>
  <div class="pwin-body single">
    <div id="task-list" class="task-list empty">暂无下载任务</div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<div id="modal-root"></div>
<div id="menu-root"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>
